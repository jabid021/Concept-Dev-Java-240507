spring:
  application:
    name: exoBoot

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exoBoot
    username: root
    password: root123@

  jpa:
    hibernate.ddl-auto: update
    properties:
      dialect: org.hibernate.dialect.MySQLDialect
 
    show-sql: true

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  servlet:
    context-path: /exo
