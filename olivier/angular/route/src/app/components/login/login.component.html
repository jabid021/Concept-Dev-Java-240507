<h1>connexion</h1>
<div>
  <div class="form-group">
    <label for="login">login:</label>
    <input id="login" class="form-control" [(ngModel)]="login" />
  </div>

  <div class="form-group">
    <label for="password">mot de passe:</label>
    <input
      id="password"
      type="password"
      class="form-control"
      [(ngModel)]="password"
    />
  </div>
  <div>
    <button class="btn btn-outline-info" (click)="connect()">connexion</button>
  </div>
</div>
