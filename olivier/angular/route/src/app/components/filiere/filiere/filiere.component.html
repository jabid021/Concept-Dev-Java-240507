<table class="table">
  <tbody>
    @for(f of filieres;track f.id){
    <tr>
      <td>{{ f.id }}</td>
      <td>{{ f.libelle }}</td>
      <td>{{ f.debut }}</td>
      <td>{{ f.fin }}</td>
      <td>
        <button class="btn btn-outline-danger" (click)="delete(f.id!)">
          suprimer
        </button>
      </td>
    </tr>
    }
  </tbody>
</table>
